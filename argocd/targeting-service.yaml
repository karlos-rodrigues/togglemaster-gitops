apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: targeting-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karlos-rodrigues/togglemaster-gitops.git
    targetRevision: main
    path: apps/targeting-service
  destination:
    server: https://kubernetes.default.svc
    namespace: targeting
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
