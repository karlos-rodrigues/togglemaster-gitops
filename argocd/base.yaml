apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karlos-rodrigues/togglemaster-gitops.git
    targetRevision: main
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: evaluation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
