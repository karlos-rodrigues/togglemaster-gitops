apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-service-secrets
  namespace: flags
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: flag-service-secrets
  dataFrom:
    - extract:
        key: togglemaster/flag
