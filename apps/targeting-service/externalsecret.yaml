apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-service-secrets
  namespace: targeting
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: targeting-service-secrets
  dataFrom:
    - extract:
        key: togglemaster/targeting
