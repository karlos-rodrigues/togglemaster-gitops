apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-service-secrets
  namespace: targeting
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: targeting-service-secrets
  dataFrom:
    - extract:
        key: togglemaster/targeting
